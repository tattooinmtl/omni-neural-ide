[package]
name = "omni-core"
version = "1.3.4"
edition = "2021"
description = "OMNI-CODE / Ultra Rust core — harness, guardrails, API, native window"

[features]
default = ["native-window"]
native-window = ["dep:wry", "dep:tao"]

[dependencies]
zip = { version = "2", default-features = false, features = ["deflate"] }
anyhow = "1"
axum = { version = "0.7", features = ["ws", "macros"] }
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
dirs = "5"
futures = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
base64 = "0.22"
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.5", features = ["cors", "fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
walkdir = "2"
regex = "1"
once_cell = "1"
parking_lot = "0.12"
sysinfo = "0.33"
rusqlite = { version = "0.32", features = ["bundled"] }
aes-gcm = "0.10"
rand = "0.8"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security_Cryptography"] }
wry = { version = "0.47", optional = true }
tao = { version = "0.30", optional = true }

