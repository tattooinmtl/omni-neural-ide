<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>OMNI-CODE</title>
  <style>
    :root {
      --bg: #0d1117;
      --panel: #161b22;
      --sidebar: #0d1117;
      --border: #21262d;
      --text: #e6edf3;
      --muted: #8b949e;
      --accent: #58a6ff;
      --green: #3fb950;
      --red: #f85149;
      --activity: #010409;
      --caret: #e6edf3;
      --glow: #58a6ff44;
    }
    body[data-theme="light"] {
      --bg: #ffffff;
      --panel: #f6f8fa;
      --sidebar: #f6f8fa;
      --border: #d0d7de;
      --text: #24292f;
      --muted: #57606a;
      --accent: #0969da;
      --green: #1a7f37;
      --red: #cf222e;
      --activity: #f6f8fa;
      --caret: #24292f;
      --glow: #0969da22;
    }
    body[data-style="plain"] { --glow: transparent; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 13px/1.4 system-ui, Segoe UI, sans-serif; }
    body { display: flex; flex-direction: column; }
    .topbar { display: flex; align-items: center; gap: 12px; padding: 4px 12px; background: var(--panel); border-bottom: 1px solid var(--border); height: 32px; }
    .title { font-weight: 600; letter-spacing: 0.5px; }
    .badge { font-size: 10px; color: var(--muted); padding: 1px 6px; border: 1px solid var(--border); border-radius: 3px; }
    .layout { flex: 1; display: grid; grid-template-columns: 48px 240px 1fr 300px; min-height: 0; }
    .activity { background: var(--activity); border-right: 1px solid var(--border); display: flex; flex-direction: column; align-items: center; padding-top: 6px; gap: 2px; }
    .act-btn { width: 40px; height: 40px; border: 0; background: transparent; color: var(--muted); border-radius: 4px; cursor: pointer; font-size: 16px; }
    .act-btn.active, .act-btn:hover { background: var(--border); color: var(--text); }
    body[data-style="ultra"] .act-btn.active { box-shadow: inset 2px 0 0 var(--accent); }
    .sidebar { background: var(--sidebar); border-right: 1px solid var(--border); display: flex; flex-direction: column; min-height: 0; }
    .side-head { padding: 6px 12px; font-size: 11px; letter-spacing: 0.5px; color: var(--muted); border-bottom: 1px solid var(--border); text-transform: uppercase; }
    .file-list { flex: 1; overflow: auto; padding: 2px; }
    .file { padding: 3px 8px; border-radius: 3px; cursor: pointer; font-size: 12px; display: flex; align-items: center; gap: 6px; }
    .file:hover { background: var(--border); }
    .file.active { background: #1f6feb33; }
    .editor { display: flex; flex-direction: column; min-width: 0; }
    .tabs { display: flex; background: var(--panel); border-bottom: 1px solid var(--border); height: 35px; align-items: stretch; }
    .tab { padding: 0 14px; display: flex; align-items: center; gap: 8px; border-right: 1px solid var(--border); font-size: 12px; }
    .tab.active { background: var(--bg); border-bottom: 2px solid var(--accent); }
    .editor-body { flex: 1; display: flex; min-height: 0; }
    textarea { flex: 1; border: 0; resize: none; background: var(--bg); color: var(--text); font: 13px/1.5 ui-monospace, Consolas, monospace; padding: 12px 16px; outline: none; caret-color: var(--caret); }
    input { caret-color: var(--caret); }
    .chat { background: var(--panel); border-left: 1px solid var(--border); display: flex; flex-direction: column; min-height: 0; }
    .chat-head { padding: 6px 12px; font-size: 11px; letter-spacing: 0.5px; color: var(--muted); border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; text-transform: uppercase; }
    .transcript { flex: 1; overflow: auto; padding: 8px; }
    .line { margin: 4px 0; padding: 6px 8px; border-radius: 6px; font-size: 12px; }
    .line.you { background: #1f6feb22; }
    .line.assistant { background: var(--border); }
    .assist-form { display: flex; gap: 6px; padding: 8px; border-top: 1px solid var(--border); }
    .assist-form input { flex: 1; background: var(--bg); border: 1px solid var(--border); color: var(--text); border-radius: 4px; padding: 6px 8px; }
    .btn { background: var(--accent); color: #fff; border: 0; border-radius: 4px; padding: 5px 10px; cursor: pointer; font-size: 12px; }
    body[data-style="ultra"] .btn { box-shadow: 0 0 8px var(--glow); }
    .status { display: flex; gap: 16px; padding: 3px 12px; background: var(--panel); border-top: 1px solid var(--border); font-size: 11px; color: var(--muted); height: 22px; align-items: center; }
    .bottom-bar { display: flex; gap: 8px; padding: 6px 12px; background: var(--panel); border-top: 1px solid var(--border); }
    .bottom-bar button { background: var(--border); color: var(--text); border: 0; border-radius: 4px; padding: 5px 12px; cursor: pointer; font-size: 11px; }
    body[data-style="ultra"] .bottom-bar button:hover { box-shadow: 0 0 6px var(--glow); }
    .goalbar { display: flex; gap: 6px; padding: 6px 12px; background: var(--panel); border-bottom: 1px solid var(--border); }
    .goalbar input { flex: 1; background: var(--bg); border: 1px solid var(--border); color: var(--text); border-radius: 4px; padding: 5px 8px; }
    .nim-panel { height: 120px; background: #010409; border-top: 1px solid var(--border); display: flex; flex-direction: column; }
    .nim-head { padding: 4px 12px; font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; }
    .nim-log { flex: 1; overflow: auto; padding: 4px 12px; font: 11px ui-monospace, Consolas, monospace; color: #7ee787; }
    .floating { position: fixed; right: 24px; bottom: 60px; width: 300px; background: var(--panel); border: 1px solid var(--border); border-radius: 8px; box-shadow: 0 8px 24px #0006; display: flex; flex-direction: column; z-index: 20; }
    .float-head { padding: 6px 10px; font-size: 11px; cursor: move; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; }
    .float-body { max-height: 160px; overflow: auto; padding: 6px; font-size: 12px; }
    .actions { display: flex; gap: 4px; padding: 6px; flex-wrap: wrap; }
    .actions button { background: var(--border); color: var(--text); border: 0; border-radius: 4px; padding: 3px 7px; font-size: 10px; cursor: pointer; }
    .empty { color: var(--muted); font-size: 12px; padding: 8px; }
    .warn { color: var(--red); }
  </style>
</head>
<body data-theme="dark" data-style="ultra">
  <div class="topbar">
    <span class="title" id="app-title">OMNI-CODE Ultra</span>
    <span class="badge" id="style-name">Ultra</span>
    <span class="badge" id="sb-theme">Dark</span>
    <span class="badge" id="sb-mood">calm</span>
  </div>
  <form class="goalbar" id="goalbar">
    <input id="goal" placeholder="Goal (creates plan.md, agents.md, instructions.txt)" />
    <button type="submit" class="btn" id="run">Run</button>
    <button type="button" class="btn" id="accept" hidden>Accept</button>
    <button type="button" class="btn" id="reject" hidden>Reject</button>
    <button type="button" class="btn" id="continue" hidden>Continue</button>
  </form>
  <div class="layout">
    <div class="activity">
      <button class="act-btn active" title="Explorer">■</button>
      <button class="act-btn" title="Search">⌕</button>
      <button class="act-btn" title="Graph">◎</button>
      <button class="act-btn" id="open-settings" title="Settings">⚙</button>
    </div>
    <div class="sidebar">
      <div class="side-head">Explorer</div>
      <div class="file-list" id="file-list"></div>
      <div class="side-head">Problems</div>
      <div class="file-list" id="problem-list"></div>
    </div>
    <div class="editor">
      <div class="tabs">
        <div class="tab active" id="tab-name">no file</div>
        <button class="btn" id="save" style="margin: 4px 8px; padding: 2px 8px;">Save</button>
      </div>
      <div class="editor-body">
        <textarea id="code" spellcheck="false" placeholder="Open a file or run a goal"></textarea>
      </div>
    </div>
    <div class="chat">
      <div class="chat-head">
        <span>Assistant</span>
        <span>
          <button class="btn" id="voice-toggle" style="padding: 2px 6px; font-size: 10px;">Voice Off</button>
          <button class="btn" id="mute" style="padding: 2px 6px; font-size: 10px;">Mute</button>
        </span>
      </div>
      <div class="transcript" id="transcript"></div>
      <form class="assist-form" id="assist-form">
        <input id="assist-input" placeholder="Talk to assistant…" />
        <button type="submit" class="btn">Send</button>
      </form>
    </div>
  </div>
  <div class="nim-panel">
    <div class="nim-head">NIM Sandbox Console (NVIDIA) — write only inside sandbox, read anywhere</div>
    <div class="nim-log" id="nim-log"><div class="empty">NIM idle. Type /nim &lt;job&gt; in assistant.</div></div>
  </div>
  <div class="bottom-bar">
    <button>Run</button>
    <button>Debug</button>
    <button>Test</button>
  </div>
  <div class="status">
    <span>Phase: <b id="sb-step">idle</b></span>
    <span>Drift: <b id="sb-drift">none</b></span>
    <span>Voice: <b id="sb-voice">Off</b></span>
    <span>Mood: <b id="sb-mood-bar">calm</b></span>
  </div>

  <div class="floating" id="assistant">
    <div class="float-head" id="assist-drag">
      <span>Floating Assistant</span>
      <span>
        <button id="audit" style="font-size: 10px;">Audit</button>
        <button id="mark" style="font-size: 10px;">Mark</button>
        <button id="clear-drift" style="font-size: 10px;">Clear Drift</button>
      </span>
    </div>
    <div class="float-body" id="float-transcript"></div>
    <div class="actions">
      <button data-action="note">Note</button>
      <button data-action="steer">Steer</button>
      <button data-action="scan">Scan</button>
      <button data-action="mkdir">Mkdir</button>
      <button data-action="search">Search</button>
    </div>
  </div>

  <div id="settings" style="display:none; position:fixed; right:16px; top:40px; width:260px; background:var(--panel); border:1px solid var(--border); border-radius:8px; padding:12px; z-index:30;">
    <div style="font-size:11px; color:var(--muted); margin-bottom:8px;">SETTINGS</div>
    <label>Theme <select id="set-theme"><option value="dark">dark</option><option value="light">light</option></select></label><br>
    <label>Version <select id="set-style"><option value="ultra">ultra</option><option value="plain">plain</option></select></label><br>
    <label>Font size <input id="set-font" type="number" min="11" max="22" value="13" /></label><br>
    <label>Drift <select id="set-drift"><option value="warn">warn</option><option value="pause">pause</option></select></label><br>
    <label>Intervention <select id="set-int"><option value="pass">pass</option><option value="hold">hold</option></select></label><br>
    <button class="btn" id="save-settings" style="margin-top:8px;">Save</button>
  </div>

  <script type="module" src="src/main.js"></script>
</body>
</html>
